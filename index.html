<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshCart - E-Commerce Store</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230aad0a'/%3E%3Cpath d='M16 20h6l5 20h20l5-14H24' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='48' r='3.5' fill='%23fff'/%3E%3Ccircle cx='44' cy='48' r='3.5' fill='%23fff'/%3E%3C/svg%3E"
  />

  <!-- Google Fonts: Encode Sans Expanded & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap 5.3 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Font Awesome 6.5 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Global Loading Overlay -->
  <div id="globalLoader" class="loader-overlay d-none">
    <div class="spinner-border text-fresh" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-light-surface sticky-top border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#/home">
        <span class="brand-cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
        </span>
        <span>FreshCart</span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
          <li class="nav-item">
            <a class="nav-link" href="#/home" data-route="home">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/products" data-route="products">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/categories" data-route="categories">Categories</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/brands" data-route="brands">Brands</a>
          </li>
          <li class="nav-item auth-only d-none">
            <a class="nav-link" href="#/allorders" data-route="allorders">Orders</a>
          </li>
        </ul>

        <!-- Right Controls -->
        <div class="d-flex align-items-center gap-3">
          <a href="#/wishlist" class="nav-badge-link auth-only d-none" title="Wishlist" aria-label="Wishlist">
            <i class="fa-regular fa-heart fs-5"></i>
            <span class="badge-pill" id="wishlistBadge">0</span>
          </a>

          <a href="#/cart" class="nav-badge-link auth-only d-none" title="Cart" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping fs-5"></i>
            <span class="badge-pill" id="cartBadge">0</span>
          </a>

          <!-- Logged-in Dropdown -->
          <div class="dropdown auth-only d-none">
            <button
              class="btn btn-outline-fresh btn-sm dropdown-toggle d-flex align-items-center gap-2"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="fa-regular fa-user"></i>
              <span id="navUserName">Account</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#/profile"><i class="fa-solid fa-key me-2"></i>Profile &amp; Password</a></li>
              <li><a class="dropdown-item" href="#/allorders"><i class="fa-solid fa-box me-2"></i>My Orders</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><button class="dropdown-item text-danger" id="logoutBtn" type="button"><i class="fa-solid fa-right-from-bracket me-2"></i>Sign Out</button></li>
            </ul>
          </div>

          <!-- Guest Links -->
          <div class="d-flex align-items-center gap-2 guest-only">
            <a href="#/login" class="btn btn-outline-fresh btn-sm">Login</a>
            <a href="#/register" class="btn btn-fresh btn-sm">Register</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main SPA View Container -->
  <main id="appRoot" class="py-4 min-vh-75"></main>

  <!-- Footer -->
  <footer class="bg-light-surface border-top py-5 mt-5">
    <div class="container">
      <div class="row g-4 align-items-center">
        <div class="col-md-6">
          <h4 class="fw-bold mb-1">Get the FreshCart app</h4>
          <p class="text-muted mb-0">We will send you a link, open it on your phone to download the app.</p>
        </div>
        <div class="col-md-6">
          <form class="d-flex gap-2" id="footerAppForm">
            <input type="email" class="form-control" placeholder="Email .." required />
            <button type="submit" class="btn btn-fresh text-nowrap px-4">Share App Link</button>
          </form>
        </div>
      </div>
      <hr class="my-4" />
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 small text-muted">
        <div class="d-flex align-items-center gap-3">
          <span class="fw-semibold text-dark">Payment Partners:</span>
          <span><i class="fa-brands fa-cc-visa fa-lg"></i></span>
          <span><i class="fa-brands fa-cc-mastercard fa-lg"></i></span>
          <span><i class="fa-brands fa-cc-paypal fa-lg"></i></span>
        </div>
        <div>&copy; 2026 FreshCart E-Commerce. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- API & App -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
